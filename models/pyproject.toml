[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ie_models"
version = "0.1.0"
description = "Analysis pipelines for the Interview Eval Agent"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pyyaml>=6.0"]

[project.optional-dependencies]
speech = ["openai-whisper", "torch"]
scoring = ["sentence-transformers"]
vocal = ["librosa", "soundfile"]
visual = ["mediapipe", "opencv-python"]
dev = ["pytest", "jupyter"]

[tool.setuptools.packages.find]
include = ["ie_models*"]
