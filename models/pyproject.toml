[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ie_models"
version = "0.1.0"
description = "Analysis pipelines for the Interview Eval Agent"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pyyaml>=6.0"]

[project.optional-dependencies]
speech = ["faster-whisper>=1.1"]
scoring = ["sentence-transformers"]
text = ["torch", "transformers>=4.46"]
vocal = ["librosa", "soundfile"]
visual = ["mediapipe>=0.10.14", "torch", "safetensors"]  # mediapipe brings opencv-contrib-python
dev = ["pytest", "jupyter"]

[tool.setuptools.packages.find]
include = ["ie_models*"]
